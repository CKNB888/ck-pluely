# ck-pluely release: tag vX.Y.Z → GitHub Release with ck-pluely_* installers
# macOS (aarch64 + x86_64 dmg), Windows (NSIS exe + MSI), Linux (deb/rpm/AppImage).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            target: ""
          - platform: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libpulse-dev libssl-dev libxdo-dev rpm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CK Pluely ${{ github.ref_name }}"
          assetNamePattern: "ck-pluely_[version]_[platform]_[arch][setup][ext]"
          releaseBody: |
            CK Pluely —— 中文优先的实时 AI 会议 / 面试 / 课堂助手。更新内容见 RELEASE_NOTES.zh-CN.md。

            ⚠️ 未经 Apple 公证（ad-hoc 签名）：macOS 首次打开请右键 → 打开，或执行 `xattr -cr "/Applications/CK Pluely.app"`；Windows SmartScreen 请点“更多信息 → 仍要运行”。

            Based on Pluely by Srikanth Nani (GPL-3.0). Maintained by CKNB (https://github.com/cknb6).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
