# ck-pluely release: tag vX.Y.Z → GitHub Release with ck-pluely_* installers
# macOS (aarch64 + x86_64 dmg), Windows (NSIS exe + MSI), Linux (deb/rpm/AppImage).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要上传到的发布标签（如 v1.0.0），留空则只构建产物"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            target: ""
          - platform: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libpulse-dev libssl-dev libxdo-dev rpm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          releaseName: "CK Pluely ${{ inputs.tag || github.ref_name }}"
          assetNamePattern: "ck-pluely_[version]_[platform]_[arch][setup][ext]"
          releaseBody: |
            CK Pluely —— 中文优先的实时 AI 会议 / 面试 / 课堂助手。更新内容见 RELEASE_NOTES.zh-CN.md。

            ⚠️ 未经 Apple 公证（ad-hoc 签名）：macOS 首次打开请右键 → 打开，或执行 `xattr -cr "/Applications/CK Pluely.app"`；Windows SmartScreen 请点“更多信息 → 仍要运行”。

            Based on Pluely by Srikanth Nani (GPL-3.0). Maintained by CKNB (https://github.com/CKNB888).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Build macOS .pkg and attach
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          V="$(node -p "require('./package.json').version")"
          APP="$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)"
          test -d "$APP" || { echo "::error::.app not found"; exit 1; }
          ARCH=$([ "${{ matrix.target }}" = aarch64-apple-darwin ] && echo aarch64 || echo x64)
          PKG="ck-pluely_${V}_macos_${ARCH}.pkg"
          pkgbuild --component "$APP" --install-location /Applications "$PKG"
          if [[ "$TAG" == v* ]]; then gh release upload "$TAG" "$PKG" --clobber --repo "$GITHUB_REPOSITORY"; fi
      - uses: actions/upload-artifact@v4
        if: startsWith(matrix.platform, 'macos')
        with:
          name: pkg-${{ matrix.target }}
          path: "*.pkg"
