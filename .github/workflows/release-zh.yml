name: Release (zh)

on:
  push:
    tags: ["v*-zh*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            target: ""
          - platform: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libpulse-dev libssl-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Pluely 中文版 ${{ github.ref_name }}"
          releaseBody: |
            Pluely 多语言（简体中文）+ Bug 修复版，基于上游开源版 v0.1.9。更新内容见 CHANGELOG.zh-CN.md。

            ⚠️ 安装包未签名：macOS 如提示无法打开，请执行 `xattr -cr /Applications/Pluely.app`；Windows SmartScreen 请点“更多信息 → 仍要运行”。

            Unsigned builds of the multi-language fork by CKNB (https://github.com/cknb6).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --config {"bundle":{"createUpdaterArtifacts":false}}
